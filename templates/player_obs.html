<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Player OBS - Receptor</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
        #player { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        let player = null;
        let videoIdAtivo = null;
        let apiPronta = false;

        // Executado assim que o script anexado abaixo terminar de baixar
        function onYouTubeIframeAPIReady() {
            apiPronta = true;
            setInterval(sincronizarComPython, 1000);
        }

        async function sincronizarComPython() {
            if (!apiPronta) return;
            try {
                const res = await fetch('/api/estado_sincronizado');
                const dados = await res.json();

                if (!dados.id) {
                    if (player && typeof player.stopVideo === 'function') player.stopVideo();
                    videoIdAtivo = null;
                    return;
                }

                if (videoIdAtivo !== dados.id) {
                    videoIdAtivo = dados.id;
                    if (!player) {
                        player = new YT.Player('player', {
                            height: '100%', width: '100%', videoId: dados.id,
                            playerVars: { 'autoplay': 1, 'controls': 0, 'rel': 0 }
                        });
                    } else if (typeof player.loadVideoById === 'function') {
                        player.loadVideoById({ videoId: dados.id });
                    }
                }

                if (player && typeof player.getPlayerState === 'function') {
                    const state = player.getPlayerState();
                    
                    if (dados.status === 'tocando' && state !== YT.PlayerState.PLAYING) {
                        player.playVideo();
                    } else if (dados.status !== 'tocando' && state === YT.PlayerState.PLAYING) {
                        player.pauseVideo();
                    }

                    // --- INSERÇÃO AQUI: SINCRONIZAR A VELOCIDADE NO OBS ---
                    if (dados.velocidade && typeof player.getPlaybackRate === 'function' && typeof player.setPlaybackRate === 'function') {
                        if (player.getPlaybackRate() !== dados.velocidade) {
                            player.setPlaybackRate(dados.velocidade);
                        }
                    }
                    // -----------------------------------------------------------------

                    if (typeof player.getCurrentTime === 'function') {
                        const tempoLocal = player.getCurrentTime();
                        // MODIFICAÇÃO AQUI: Compensamos o atraso adicionando + 1s ao tempo alvo vindo do Python
                        const tempoAlvoComCompensacao = dados.tempo + 1.0;

                        // Reduzimos o limite para 1 segundo para garantir que ele force e trave na distância ideal
                        if (Math.abs(tempoLocal - tempoAlvoComCompensacao) > 1 && dados.tempo > 0) {
                            player.seekTo(tempoAlvoComCompensacao, true);
                        }
                    }
                }
            } catch (e) { console.error("Erro na sincronia do OBS:", e); }
        }

        // --- CARREGAMENTO SEGURO DA API DO YOUTUBE (MÉTODO DO MONITOR) ---
        // Construção limpa usando variáveis em duas linhas e injeção sem erros de array
        (function() {
            var dominioBase = "https://youtube.com";
            var caminhoApi = "/iframe_api";
            var linkCompletoApi = dominioBase + caminhoApi;

            var tagScript = document.createElement('script');
            tagScript.src = linkCompletoApi;
            document.head.appendChild(tagScript);
        })();
    </script>
</body>
</html>
